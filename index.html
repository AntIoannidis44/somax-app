<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070f2a" />
    <!-- iOS ignores the manifest for "Add to Home Screen" and needs its own
         meta tags to open as a standalone app (no Safari chrome) instead of
         just bookmarking the page. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Somax" />
    <title>Somax</title>
    <!-- Static, JS-free splash: the WebView has to download, parse and
         evaluate the whole module graph (React, the store, Home, the full
         Three.js/R3F stack - Home's Arena needs a live 3D view on the very
         first screen, so none of that can be deferred) before React's own
         first render ever commits. Until this HTML/CSS existed, that whole
         window was a blank white flash - the actual "loading doesn't feel
         seamless" complaint. This paints instantly (inline, no stylesheet
         to wait on) and is replaced automatically the moment React's first
         render lands in #root, with zero extra JS of its own. -->
    <style>
      html, body { background: #070f2a; margin: 0; }
      #boot-splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #070f2a;
      }
      #boot-splash svg { width: 44px; height: 42px; animation: boot-pulse 1.1s ease-in-out infinite; }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(.88); opacity: .55; }
        50% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <svg viewBox="0 0 48 46" fill="none">
          <defs>
            <linearGradient id="boot-splash-grad" x1="0" y1="0" x2="48" y2="46" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#4866f6" />
              <stop offset="1" stop-color="#8936e8" />
            </linearGradient>
          </defs>
          <path
            fill="url(#boot-splash-grad)"
            d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"
          />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
